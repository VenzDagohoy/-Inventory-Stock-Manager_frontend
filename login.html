<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container auth-container">
        <h1 class="auth-title">Store Inventory Manager</h1>
        
        <div class="card">
            <h2>Manager Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input id="email" type="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input id="password" type="password" required>
                </div>
                <button type="submit" id="login-btn" class="btn-login-submit full-width">Log in</button>
            </form>
            
            <div id="loading" class="auth-loading-text">Logging in...</div>
            
            <p id="message" class="message"></p>
            
            <div class="auth-link-container">
                <a href="./register.html" class="auth-link-anchor">Don't have an account? Register here.</a>
            </div>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
