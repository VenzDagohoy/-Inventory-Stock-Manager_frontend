<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container auth-container">
        <h1 class="auth-title">Store Inventory Manager</h1>
        
        <div class="card">
            <h2>Create an Account</h2>
            <form id="register-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input id="name" type="text" required placeholder="e.g., Jane Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input id="email" type="email" required placeholder="e.g., jane@store.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input id="password" type="password" required minlength="8" placeholder="At least 8 characters">
                </div>
                <button type="submit" id="register-btn" class="btn-register-submit full-width">Register</button>
            </form>
            
            <div id="loading" class="auth-loading-text">Registering account...</div>
            
            <p id="message" class="message"></p>
            
            <div class="auth-link-container">
                <a href="./login.html" class="auth-link-anchor">Already have an account? Log in here.</a>
            </div>
        </div>
    </div>
    <script src="register.js"></script>
</body>
</html>
